workflows:
  build:
    name: Build
    environment:
      vars:
        BUILD_TYPE: "Release"  # Тип сборки (Release/Debug)
    scripts:
      - name: Install Depends
        script: |
          brew install mingw-w64
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y

      - name: Install Rust and targets using Rustup
        script: |
          . "$HOME/.cargo/env"
          rustup default stable
          rustup target add x86_64-pc-windows-gnu
      - name: Building
        script: |
           . "$HOME/.cargo/env"
           cargo build --release --target x86_64-pc-windows-gnu
    artifacts:
      - target/x86_64-pc-windows-gnu/release/*.exe
    cache:
      cache_paths:
        - ~/.cargo
        - target
  triggering:
  events:                       # List the events that trigger builds
    - push
    - pull_request
    - pull_request_labeled      #GitHub only
    - tag
  branch_patterns:              # Include or exclude watched branches
    - pattern: '*'
      include: true
      source: true
    - pattern: excluded-target
      include: false
      source: false
    - pattern: included-source
      include: true
      source: true
  tag_patterns:                 # Include or exclude watched tag labels
    - pattern: '*'
      include: true
    - pattern: excluded-tag
      include: false
    - pattern: included-tag
      include: true
  cancel_previous_builds: false  # Set to `true` to automatically cancel outdated webhook builds
